{% extends "base.html" %}
{% block title %}Ingreso al sistema{% endblock title %}
{% block content %}
    <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-lg border-0 rounded-lg login-card">
                    <div class="card-body p-5">
                        <h1 class="card-title text-center mb-4 text-primary">
                            <i class="fas fa-user-circle"></i> Ingreso al Sistema
                        </h1>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label for="username" class="form-label fw-bold">Nombre de usuario</label>
                                <input type="text" name="username" class="form-control form-control-lg" id="username" placeholder="Ingrese su usuario" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-bold">Contraseña</label>
                                <input type="password" name="password" class="form-control form-control-lg" id="password" placeholder="Ingrese su contraseña" required>  
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                    <i class="fas fa-sign-in-alt"></i> Ingresar
                                </button>
                                <a href="{% url "pokedex:index" %}" class="btn btn-outline-secondary btn-lg">
                                    <i class="fas fa-arrow-left"></i> Regresar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock content %}
